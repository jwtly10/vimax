[package]
name = "vimax"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
arboard = "3"
async-process = "2.5.0"
iced = { version = "0.14.0", features = ["advanced", "smol"] }
ignore = "0.4.25"
lsp-types = "0.97.0"
nucleo-matcher = "0.3.1"
ropey = "1.6.1"
serde_json = "1.0.149"
smol = "2.0.2"
smol_str = "0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tree-house = "0.3"
tree-house-bindings = { version = "0.2", features = ["ropey", "tree-sitter-language"] }
tree-sitter-rust = "0.24.0"
