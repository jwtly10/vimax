[package]
name = "remax"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
arboard = "3"
iced = { version = "0.14.0", features = ["advanced"] }
ignore = "0.4.25"
nucleo-matcher = "0.3.1"
ropey = "1.6.1"
smol_str = "0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tree-house = "0.3"
tree-house-bindings = { version = "0.2", features = ["ropey", "tree-sitter-language"] }
tree-sitter-rust = "0.24.0"
